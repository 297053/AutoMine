name: Build AutoMine (client, win-x64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (LeviLamina client)
        run: xmake f --target_type=client -m release -y

      - name: Build
        run: xmake -v

      - name: Collect DLL + manifest
        shell: pwwsh
        run: |
          $out = "artifact/auto-mine"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $dll = Get-ChildItem -Path build -Recurse -Filter "auto-mine.dll" | Select-Object -First 1
          if ($null -eq $dll) { throw "auto-mine.dll not found in build output" }
          Write-Host "DLL: $($dll.FullName)"
          Copy-Item $dll.FullName "$out/auto-mine.dll"

          $manifest = Get-ChildItem -Path build -Recurse -Filter "manifest.json" |
                      Where-Object { $_.FullName -like "*auto-mine*" } |
                      Select-Object -First 1
          if ($null -eq $manifest) {
            $manifest = Get-ChildItem -Path build -Recurse -Filter "manifest.json" | Select-Object -First 1
          }
          if ($null -ne $manifest) {
            Write-Host "Manifest: $($manifest.FullName)"
            Copy-Item $manifest.FullName "$out/manifest.json"
          } else {
            Copy-Item manifest.json "$out/manifest.json"
          }

          Get-ChildItem $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-mine-win-x64
          path: artifact/auto-mine
          if-no-files-found: error
